# Configuración compartida por todos los microservicios
  spring:
    datasource:
      driver-class-name: org.postgresql.Driver
      username: arka_user
      password: arka_password

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuración de Eureka (Service Discovery)
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka

  # Actuator
  management:
    endpoints:
      web:
        exposure:
          include: "*"
    endpoint:
      health:
        show-details: always

  # Logging
  logging:
    level:
      com.arka: DEBUG
      org.springframework.cloud: DEBUG