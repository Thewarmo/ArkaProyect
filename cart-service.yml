server:
  port: 8086

spring:
  application:
    name: cart-service

  data:
    mongodb:
      # Use MongoDB Atlas M0 free tier (or Railway MongoDB)
      uri: ${MONGODB_URI:mongodb://localhost:27017/arka_carts}
      auto-index-creation: true

# URLs de servicios externos
services:
  customer-service:
    url: http://localhost:8083
  product-service:
    url: http://localhost:8081
  inventory-service:
    url: http://localhost:8084
  order-service:
    url: http://localhost:8085
  notification-service:
    url: http://localhost:8087

# Configuración de carritos abandonados
carts:
  abandoned:
    threshold-days: 3
    schedule:
      cron: "0 0 9 * * *"  # Cada día a las 9:00 AM
      enabled: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,scheduledtasks
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.arka.cart_service: DEBUG
    org.springframework.data.mongodb: DEBUG
