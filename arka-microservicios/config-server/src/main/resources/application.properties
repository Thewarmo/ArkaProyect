spring.application.name=config-server
server.port=8889

# Git repository configuration (uses environment variables for production)
spring.cloud.config.server.git.uri=${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:file:///C:/Users/Andres/Documents/ProyectoArkaAceleraTi/arka-config-repo}
spring.cloud.config.server.git.default-label=${SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.username=${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME:}
spring.cloud.config.server.git.password=${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD:}

# Actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always