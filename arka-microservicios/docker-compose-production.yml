# Docker Compose for AWS EC2 Production Deployment
# Optimized for t2.micro (1GB RAM) with external databases
# All microservices + monitoring stack
version: '3.8'

services:
  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================

  config-server:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-config-server:${TAG:-latest}
    container_name: config-server
    ports:
      - "8889:8889"
    environment:
      JAVA_OPTS: >-
        -Xmx384m -Xms128m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=96m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/yourusername/arka-config-repo}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_GIT_BRANCH:-main}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${CONFIG_GIT_USERNAME:-}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${CONFIG_GIT_PASSWORD:-}
    mem_limit: 512m
    mem_reservation: 384m
    cpus: 0.3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8889/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  eureka-server:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-eureka-server:${TAG:-latest}
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: >-
        -Xmx128m -Xms64m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -XX:+UseStringDeduplication
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_HOSTNAME:-localhost}
    mem_limit: 160m
    mem_reservation: 128m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================
  # GATEWAY & SECURITY
  # ============================================

  api-gateway:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-api-gateway:${TAG:-latest}
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: >-
        -Xmx128m -Xms64m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    mem_limit: 160m
    mem_reservation: 128m
    cpus: 0.4
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  auth-server:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-auth-server:${TAG:-latest}
    container_name: auth-server
    ports:
      - "8081:8081"
    environment:
      JAVA_OPTS: >-
        -Xmx96m -Xms48m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Railway PostgreSQL
      SPRING_DATASOURCE_URL: ${RAILWAY_POSTGRES_URL}
      SPRING_DATASOURCE_USERNAME: ${RAILWAY_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${RAILWAY_POSTGRES_PASSWORD}
      # JWT Secret
      JWT_SECRET: ${JWT_SECRET:-ArkaSecretKeyForJWTTokenGenerationAndValidation2024!MustBeLongEnoughForHS256Algorithm}
    mem_limit: 128m
    mem_reservation: 96m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================
  # BUSINESS SERVICES
  # ============================================

  product-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-product-service:${TAG:-latest}
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      JAVA_OPTS: >-
        -Xmx80m -Xms40m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: ${RAILWAY_POSTGRES_URL}
      SPRING_DATASOURCE_USERNAME: ${RAILWAY_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${RAILWAY_POSTGRES_PASSWORD}
    mem_limit: 112m
    mem_reservation: 80m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  customer-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-customer-service:${TAG:-latest}
    container_name: customer-service
    ports:
      - "8083:8083"
    environment:
      JAVA_OPTS: >-
        -Xmx80m -Xms40m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: ${RAILWAY_POSTGRES_URL}
      SPRING_DATASOURCE_USERNAME: ${RAILWAY_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${RAILWAY_POSTGRES_PASSWORD}
    mem_limit: 112m
    mem_reservation: 80m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  inventory-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-inventory-service:${TAG:-latest}
    container_name: inventory-service
    ports:
      - "8084:8084"
    environment:
      JAVA_OPTS: >-
        -Xmx80m -Xms40m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: ${RAILWAY_POSTGRES_URL}
      SPRING_DATASOURCE_USERNAME: ${RAILWAY_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${RAILWAY_POSTGRES_PASSWORD}
    mem_limit: 112m
    mem_reservation: 80m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  order-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-order-service:${TAG:-latest}
    container_name: order-service
    ports:
      - "8085:8085"
    environment:
      JAVA_OPTS: >-
        -Xmx96m -Xms48m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: ${RAILWAY_POSTGRES_URL}
      SPRING_DATASOURCE_USERNAME: ${RAILWAY_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${RAILWAY_POSTGRES_PASSWORD}
      # CloudAMQP RabbitMQ
      SPRING_RABBITMQ_ADDRESSES: ${CLOUDAMQP_URL}
    mem_limit: 128m
    mem_reservation: 96m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  cart-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-cart-service:${TAG:-latest}
    container_name: cart-service
    ports:
      - "8086:8086"
    environment:
      JAVA_OPTS: >-
        -Xmx80m -Xms40m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # MongoDB Atlas
      SPRING_DATA_MONGODB_URI: ${MONGODB_ATLAS_URI}
    mem_limit: 112m
    mem_reservation: 80m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  notification-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-notification-service:${TAG:-latest}
    container_name: notification-service
    ports:
      - "8087:8087"
    environment:
      JAVA_OPTS: >-
        -Xmx80m -Xms40m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # CloudAMQP RabbitMQ
      SPRING_RABBITMQ_ADDRESSES: ${CLOUDAMQP_URL}
      # Email configuration
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    mem_limit: 112m
    mem_reservation: 80m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  report-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourusername}/arka-report-service:${TAG:-latest}
    container_name: report-service
    ports:
      - "8088:8088"
    environment:
      JAVA_OPTS: >-
        -Xmx80m -Xms40m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=64m
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8889
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: ${RAILWAY_POSTGRES_URL}
      SPRING_DATASOURCE_USERNAME: ${RAILWAY_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${RAILWAY_POSTGRES_PASSWORD}
    mem_limit: 112m
    mem_reservation: 80m
    cpus: 0.3
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================
  # MONITORING SERVICES
  # ============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    mem_limit: 120m
    mem_reservation: 100m
    cpus: 0.2
    restart: unless-stopped
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    mem_limit: 120m
    mem_reservation: 100m
    cpus: 0.2
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================
  # REVERSE PROXY
  # ============================================

  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    mem_limit: 40m
    mem_reservation: 32m
    cpus: 0.1
    restart: unless-stopped
    depends_on:
      - api-gateway
      - eureka-server
    networks:
      - arka-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  arka-network:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local