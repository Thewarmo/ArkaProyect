# Prometheus configuration for local development
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'arka-local'
    environment: 'dev'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  # Config Server (Local Docker)
  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8889']
        labels:
          service: 'config-server'
          tier: 'infrastructure'
          platform: 'local'

  # Eureka Server (Local Docker)
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8761']
        labels:
          service: 'eureka-server'
          tier: 'infrastructure'
          platform: 'local'

  # API Gateway (Local Docker)
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'api-gateway'
          tier: 'gateway'
          platform: 'local'

  # Auth Server (Local Docker)
  - job_name: 'auth-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'auth-server'
          tier: 'business'
          platform: 'local'

  # Product Service (Local Docker)
  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'product-service'
          tier: 'business'
          platform: 'local'

  # Customer Service (Local Docker)
  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: 'customer-service'
          tier: 'business'
          platform: 'local'

  # Inventory Service (Local Docker)
  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          service: 'inventory-service'
          tier: 'business'
          platform: 'local'

  # Order Service (Local Docker)
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
        labels:
          service: 'order-service'
          tier: 'business'
          platform: 'local'

  # Cart Service (Local Docker)
  - job_name: 'cart-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8086']
        labels:
          service: 'cart-service'
          tier: 'business'
          platform: 'local'

  # Notification Service (Local Docker)
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8087']
        labels:
          service: 'notification-service'
          tier: 'business'
          platform: 'local'

  # Report Service (Local Docker)
  - job_name: 'report-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8088']
        labels:
          service: 'report-service'
          tier: 'business'
          platform: 'local'