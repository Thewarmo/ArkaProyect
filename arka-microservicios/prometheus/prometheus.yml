# Prometheus configuration for Arka microservices monitoring
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    cluster: 'arka-production'
    environment: 'prod'

# Alertmanager configuration (optional - can add later)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
# rule_files:
#   - "alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  # Node Exporter (EC2 instance metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          tier: 'monitoring'
          instance: 'ec2-t2-micro'

  # Config Server (AWS EC2)
  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-server:8889']
        labels:
          service: 'config-server'
          tier: 'infrastructure'
          platform: 'aws-ec2'

  # Eureka Server (AWS EC2)
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']
        labels:
          service: 'eureka-server'
          tier: 'infrastructure'
          platform: 'aws-ec2'

  # API Gateway (AWS EC2)
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'
          tier: 'gateway'
          platform: 'aws-ec2'

  # Auth Server (Railway)
  - job_name: 'auth-server'
    metrics_path: '/actuator/prometheus'
    scheme: https
    static_configs:
      - targets: ['auth-service-production-5ff9.up.railway.app']
        labels:
          service: 'auth-server'
          tier: 'business'
          platform: 'railway'

  # Product Service (Railway)
  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    scheme: https
    static_configs:
      - targets: ['product-service-production-7298.up.railway.app']
        labels:
          service: 'product-service'
          tier: 'business'
          platform: 'railway'

  # Customer Service (Railway)
