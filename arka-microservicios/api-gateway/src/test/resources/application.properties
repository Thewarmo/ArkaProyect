# Test configuration for API Gateway
# This file overrides main application.properties for tests

spring.application.name=api-gateway

# Make config server import optional to prevent test failures
spring.config.import=optional:configserver:http://localhost:8889
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false

# Disable eureka for tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable discovery client for tests
spring.cloud.discovery.enabled=false

# Random port for tests
server.port=0
