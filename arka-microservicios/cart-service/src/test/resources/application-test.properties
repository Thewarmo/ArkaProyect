# Test configuration for Cart Service (MongoDB)
# Note: Tests that require MongoDB are disabled in CI
spring.data.mongodb.auto-index-creation=true

# Disable cloud config for tests
spring.config.import=optional:configserver:http://localhost:8889
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false

# Disable eureka for tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Random port for tests
server.port=0
