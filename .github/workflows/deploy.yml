name: Build and Deploy Arka Microservices

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Detect changed services to optimize build time
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      config-server: ${{ steps.changes.outputs.config-server }}
      eureka-server: ${{ steps.changes.outputs.eureka-server }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-server: ${{ steps.changes.outputs.auth-server }}
      product-service: ${{ steps.changes.outputs.product-service }}
      customer-service: ${{ steps.changes.outputs.customer-service }}
      inventory-service: ${{ steps.changes.outputs.inventory-service }}
      order-service: ${{ steps.changes.outputs.order-service }}
      cart-service: ${{ steps.changes.outputs.cart-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      report-service: ${{ steps.changes.outputs.report-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            config-server:
              - 'arka-microservicios/config-server/**'
            eureka-server:
              - 'arka-microservicios/eureka-server/**'
            api-gateway:
              - 'arka-microservicios/api-gateway/**'
            auth-server:
              - 'arka-microservicios/auth-server/**'
            product-service:
              - 'arka-microservicios/product-service/**'
            customer-service:
              - 'arka-microservicios/customer-service/**'
            inventory-service:
              - 'arka-microservicios/inventory-service/**'
            order-service:
              - 'arka-microservicios/order-service/**'
            cart-service:
              - 'arka-microservicios/cart-service/**'
            notification-service:
              - 'arka-microservicios/notification-service/**'
            report-service:
              - 'arka-microservicios/report-service/**'

  # Build and push Docker images for all changed services
  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - config-server
          - eureka-server
          - api-gateway
          - auth-server
          - product-service
          - customer-service
          - inventory-service
          - order-service
          - cart-service
          - notification-service
          - report-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: ./arka-microservicios/${{ matrix.service }}
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ./arka-microservicios/${{ matrix.service }}
        run: ./gradlew bootJar --no-daemon --build-cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ matrix.service }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./arka-microservicios/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Deploy infrastructure services to AWS EC2
  deploy-aws-infrastructure:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.AWS_EC2_USERNAME }}/arka-infrastructure

            # Pull latest docker-compose configuration
            git pull origin main || git pull origin master

            # Set environment variables
            export DOCKER_REGISTRY=ghcr.io/${{ github.repository_owner }}
            export TAG=latest

            # Login to GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export SPRING_PROFILES_ACTIVE=prod

            # Pull latest images
            docker-compose -f docker-compose-aws.yml pull

            # Restart services with zero-downtime
            docker-compose -f docker-compose-aws.yml up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            # Check service health
            sleep 30
            docker-compose -f docker-compose-aws.yml ps

  # Deploy business services to Railway
  deploy-railway:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-server
          - product-service
          - customer-service
          - inventory-service
          - order-service
          - cart-service
          - notification-service
          - report-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd arka-microservicios/${{ matrix.service }}
          railway up --service ${{ matrix.service }}

  # Health check after deployment
  health-check:
    needs: [deploy-aws-infrastructure, deploy-railway]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Check Eureka Server Health
        run: |
          curl -f http://${{ secrets.AWS_EC2_HOST }}/eureka/actuator/health || exit 1

      - name: Check Config Server Health
        run: |
          curl -f http://${{ secrets.AWS_EC2_HOST }}/config/actuator/health || exit 1

      - name: Check API Gateway Health (Railway)
        run: |
          curl -f ${{ secrets.RAILWAY_API_GATEWAY_URL }}/actuator/health || exit 1

      - name: Wait for service registration
        run: sleep 60

      - name: Verify Eureka Registrations
        run: |
          curl -s http://${{ secrets.AWS_EC2_HOST }}/eureka/eureka/apps | grep -q "UP" || exit 1
