name: CD - Build Docker Images

on:
  push:
    branches: [ master, main ]
    paths:
      - 'arka-microservicios/**'
  workflow_run:
    workflows: ["CI - Tests y Cobertura"]
    types:
      - completed
    branches: [ master, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/arka

jobs:
  # Solo ejecutar si los tests pasaron
  check-tests:
    name: Verificar Tests
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'
    steps:
      - name: Tests pasaron
        run: echo "✅ Tests pasaron, procediendo con build de imágenes"

  # Build Product Service
  build-product-service:
    name: Build - Product Service
    needs: check-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build JAR
        run: |
          cd arka-microservicios/product-service
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-product-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./arka-microservicios/product-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

