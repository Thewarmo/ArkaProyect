name: PR - Validaciones y Cobertura

on:
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'arka-microservicios/**'
      - '.github/workflows/**'

# Cancelar ejecuciones anteriores si se hace push a la misma PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Validar formato de código
  code-quality:
    name: Calidad de Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validar código Java
        run: |
          echo "✅ Validando formato de código..."
          # Aquí podrías agregar checkstyle, spotless, etc.

  # Tests de servicios modificados
  test-changed-services:
    name: Tests de Servicios Modificados
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - customer-service
          - inventory-service
          - order-service
          - cart-service
          - notification-service
          - report-service
          - auth-server
          - api-gateway
          - config-server
          - eureka-server

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar cambios en ${{ matrix.service }}
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - 'arka-microservicios/${{ matrix.service }}/**'

      - name: Setup Java 21
        if: steps.changes.outputs.service == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ejecutar tests de ${{ matrix.service }}
        if: steps.changes.outputs.service == 'true'
        run: |
          cd arka-microservicios/${{ matrix.service }}
          chmod +x gradlew
          ./gradlew test jacocoTestReport --no-daemon --stacktrace

      - name: Generar reporte de cobertura
        if: steps.changes.outputs.service == 'true'
        id: coverage
        run: |
          cd arka-microservicios/${{ matrix.service }}

          # Extraer porcentaje de cobertura del reporte JaCoCo XML
          if [ -f "build/reports/jacoco/test/jacocoTestReport.xml" ]; then
            COVERAGE=$(grep -oP 'type="LINE".*?covered="\K[0-9]+' build/reports/jacoco/test/jacocoTestReport.xml | head -1)
            MISSED=$(grep -oP 'type="LINE".*?missed="\K[0-9]+' build/reports/jacoco/test/jacocoTestReport.xml | head -1)
            TOTAL=$((COVERAGE + MISSED))
            if [ $TOTAL -gt 0 ]; then
              PERCENTAGE=$(awk "BEGIN {printf \"%.2f\", ($COVERAGE / $TOTAL) * 100}")
              echo "coverage=$PERCENTAGE" >> $GITHUB_OUTPUT
              echo "📊 Cobertura de ${{ matrix.service }}: $PERCENTAGE%"
            fi
          fi

      - name: Subir artefactos de test
        if: steps.changes.outputs.service == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            arka-microservicios/${{ matrix.service }}/build/reports/tests/
            arka-microservicios/${{ matrix.service }}/build/reports/jacoco/
          retention-days: 7

      - name: Comentar cobertura en PR
        if: steps.changes.outputs.service == 'true' && steps.coverage.outputs.coverage != ''
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const service = '${{ matrix.service }}';
            const threshold = 70.0;
            const status = parseFloat(coverage) >= threshold ? '✅' : '⚠️';

            const comment = `${status} **Cobertura de ${service}**: ${coverage}% (mínimo: ${threshold}%)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Resumen de la PR
  pr-summary:
    name: 📋 Resumen de PR
    needs: [code-quality, test-changed-services]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generar resumen
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              status: 'completed'
            });

            const passed = checks.check_runs.filter(c => c.conclusion === 'success').length;
            const failed = checks.check_runs.filter(c => c.conclusion === 'failure').length;
            const total = checks.check_runs.length;

            const summary = `
            ## 📊 Resumen de Validaciones

            - ✅ Checks pasados: ${passed}/${total}
            - ❌ Checks fallidos: ${failed}/${total}

            **Estado**: ${failed === 0 ? '✅ Listo para merge' : '⚠️ Requiere correcciones'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  # Verificar que pasa el umbral de cobertura
  verify-coverage-threshold:
    name: Verificar Umbral de Cobertura
    needs: test-changed-services
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verificar cobertura mínima
        run: |
          echo "🔍 Verificando que todos los servicios cumplan con 70% de cobertura..."

          FAILED=0

          for service in product-service customer-service inventory-service order-service cart-service notification-service report-service auth-server; do
            if [ -d "arka-microservicios/$service" ]; then
              cd "arka-microservicios/$service"
              if ./gradlew jacocoTestCoverageVerification --no-daemon 2>&1 | grep -q "FAILED"; then
                echo "❌ $service no cumple con el 70% de cobertura"
                FAILED=1
              else
                echo "✅ $service cumple con el 70% de cobertura"
              fi
              cd ../..
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo "❌ Algunos servicios no cumplen con el umbral de cobertura"
            exit 1
          fi

          echo "✅ Todos los servicios cumplen con el 70% de cobertura"