          echo "Config Server: ${{ needs.test-config-server.result }}"
          echo "Eureka Server: ${{ needs.test-eureka-server.result }}"

          # Verificar si alguno falló
          if [[ "${{ needs.test-product-service.result }}" == "failure" ]] || \
             [[ "${{ needs.test-customer-service.result }}" == "failure" ]] || \
             [[ "${{ needs.test-inventory-service.result }}" == "failure" ]] || \
             [[ "${{ needs.test-order-service.result }}" == "failure" ]] || \
             [[ "${{ needs.test-cart-service.result }}" == "failure" ]] || \
             [[ "${{ needs.test-notification-service.result }}" == "failure" ]] || \
             [[ "${{ needs.test-report-service.result }}" == "failure" ]] || \
             [[ "${{ needs.test-auth-server.result }}" == "failure" ]] || \
             [[ "${{ needs.test-api-gateway.result }}" == "failure" ]] || \
             [[ "${{ needs.test-config-server.result }}" == "failure" ]] || \
             [[ "${{ needs.test-eureka-server.result }}" == "failure" ]]; then
            echo "❌ Algunos tests fallaron"
            exit 1
          fi

          echo "✅ Todos los tests pasaron exitosamente"