name: CI - Tests y Cobertura

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'arka-microservicios/**'
      - '.github/workflows/ci-tests.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'arka-microservicios/**'
      - '.github/workflows/ci-tests.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Job para detectar qué servicios han cambiado
  detect-changes:
    name: Detectar Cambios
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.filter.outputs.product }}
      customer: ${{ steps.filter.outputs.customer }}
      inventory: ${{ steps.filter.outputs.inventory }}
      order: ${{ steps.filter.outputs.order }}
      cart: ${{ steps.filter.outputs.cart }}
      notification: ${{ steps.filter.outputs.notification }}
      report: ${{ steps.filter.outputs.report }}
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      config: ${{ steps.filter.outputs.config }}
      eureka: ${{ steps.filter.outputs.eureka }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            product:
              - 'arka-microservicios/product-service/**'
            customer:
              - 'arka-microservicios/customer-service/**'
            inventory:
              - 'arka-microservicios/inventory-service/**'
            order:
              - 'arka-microservicios/order-service/**'
            cart:
              - 'arka-microservicios/cart-service/**'
            notification:
              - 'arka-microservicios/notification-service/**'
            report:
              - 'arka-microservicios/report-service/**'
            auth:
              - 'arka-microservicios/auth-server/**'
            gateway:
              - 'arka-microservicios/api-gateway/**'
            config:
              - 'arka-microservicios/config-server/**'
            eureka:
              - 'arka-microservicios/eureka-server/**'

  # Job para Product Service
  test-product-service:
    name: Tests - Product Service
    needs: detect-changes
    if: needs.detect-changes.outputs.product == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x arka-microservicios/product-service/gradlew

      - name: Ejecutar tests
        run: |
          cd arka-microservicios/product-service
          ./gradlew test jacocoTestReport --no-daemon --stacktrace

      - name: Verificar cobertura
        run: |
          cd arka-microservicios/product-service
          ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Subir reporte de cobertura
        uses: codecov/codecov-action@v4
        with:
          files: ./arka-microservicios/product-service/build/reports/jacoco/test/jacocoTestReport.xml
          flags: product-service
          name: product-service-coverage
          fail_ci_if_error: false

      - name: Publicar resultados de tests
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            arka-microservicios/product-service/build/test-results/test/*.xml
          check_name: Test Results - Product Service

