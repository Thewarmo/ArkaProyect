server:
  port: 8082

spring:
  application:
    name: auth-server

  datasource:
    url: jdbc:postgresql://localhost:5433/arka_auth
    username: arka_user
    password: arka_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Configuración JWT
jwt:
  secret: ArkaSecretKeyForJWTTokenGenerationAndValidation2024!MustBeLongEnoughForHS256Algorithm
  expiration: 86400000 # 24 horas en milisegundos (24 * 60 * 60 * 1000)

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.arka.auth_server: DEBUG
    org.springframework.security: DEBUG
