# Configuración del API Gateway
  server:
    port: 8090

  spring:
    cloud:
      gateway:
        server:
          webflux:
            routes:
              - id: product-service
                uri: http://localhost:8081
                predicates:
                  - Path=/api/v1/products/**
                filters:
                  - StripPrefix=0

            globalcors:
              cors-configurations:
                '[/**]':
                  allowedOrigins: "*"
                  allowedMethods: "*"
                  allowedHeaders: "*"

  management:
    endpoints:
      web:
        exposure:
          include: "*"