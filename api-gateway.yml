# Configuración del API Gateway
  server:
    port: 8090

  spring:
    cloud:
      gateway:
        server:
          webflux:
            routes:
              - id: auth-server
                uri: http://localhost:8082
                predicates:
                  - Path=/api/v1/auth/**
                filters:
                  - StripPrefix=0

              - id: product-service
                uri: http://localhost:8081
                predicates:
                  - Path=/api/v1/products/**
                filters:
                  - StripPrefix=0

              - id: customer-service
                uri: http://localhost:8083
                predicates:
                  - Path=/api/v1/customers/**
                filters:
                  - StripPrefix=0

              - id: inventory-service
                uri: http://localhost:8084
                predicates:
                  - Path=/api/v1/inventory/**
                filters:
                  - StripPrefix=0

              - id: order-service
                uri: http://localhost:8085
                predicates:
                  - Path=/api/v1/orders/**
                filters:
                  - StripPrefix=0

              - id: cart-service
                uri: http://localhost:8086
                predicates:
                  - Path=/api/v1/carts/**
                filters:
                  - StripPrefix=0

              - id: notification-service
                uri: http://localhost:8087
                predicates:
                  - Path=/api/v1/notifications/**
                filters:
                  - StripPrefix=0

              - id: report-service
                uri: http://localhost:8088
                predicates:
                  - Path=/api/v1/reports/**
                filters:
                  - StripPrefix=0

            globalcors:
              cors-configurations:
                '[/**]':
                  allowedOrigins: "*"
                  allowedMethods: "*"
                  allowedHeaders: "*"

  management:
    endpoints:
      web:
        exposure:
          include: "*"