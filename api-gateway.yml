 # Configuración del API Gateway
  server:
    port: 8080

  spring:
    cloud:
      gateway:
        routes:
          - id: product-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/products/**
            filters:
              - StripPrefix=0

        globalcors:
          corsConfigurations:
            '[/**]':
              allowedOrigins: "*"
              allowedMethods: "*"
              allowedHeaders: "*"

  management:
    endpoints:
      web:
        exposure:
          include: "*"