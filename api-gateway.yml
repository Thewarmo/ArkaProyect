# Configuración del API Gateway
  server:
    port: 8090

  spring:
    cloud:
      gateway:
        # Habilitar descubrimiento automático via Eureka
        discovery:
          locator:
            enabled: true
            lower-case-service-id: true
        server:
          webflux:
            routes:
              # Rutas usando Eureka Service Discovery (lb = load balancer)
              - id: auth-server
                uri: lb://auth-server
                predicates:
                  - Path=/api/v1/auth/**
                filters:
                  - StripPrefix=0

              - id: product-service
                uri: lb://product-service
                predicates:
                  - Path=/api/v1/products/**
                filters:
                  - StripPrefix=0

              - id: customer-service
                uri: lb://customer-service
                predicates:
                  - Path=/api/v1/customers/**
                filters:
                  - StripPrefix=0

              - id: inventory-service
                uri: lb://inventory-service
                predicates:
                  - Path=/api/v1/inventory/**
                filters:
                  - StripPrefix=0

              - id: order-service
                uri: lb://order-service
                predicates:
                  - Path=/api/v1/orders/**
                filters:
                  - StripPrefix=0

              - id: cart-service
                uri: lb://cart-service
                predicates:
                  - Path=/api/v1/carts/**
                filters:
                  - StripPrefix=0

              - id: notification-service
                uri: lb://notification-service
                predicates:
                  - Path=/api/v1/notifications/**
                filters:
                  - StripPrefix=0

              - id: report-service
                uri: lb://report-service
                predicates:
                  - Path=/api/v1/reports/**
                filters:
                  - StripPrefix=0

            globalcors:
              cors-configurations:
                '[/**]':
                  allowedOrigins: "*"
                  allowedMethods: "*"
                  allowedHeaders: "*"

  management:
    endpoints:
      web:
        exposure:
          include: "*"